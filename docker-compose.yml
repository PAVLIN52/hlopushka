# Вся инфраструктура «Хлопушки» поднимается одной командой: docker compose up --build
# Инкремент 001: PostgreSQL + backend + frontend. Redis и MinIO появятся в инкрементах 2 и 5.

name: hlopushka

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hlopushka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hlopushka}
      POSTGRES_DB: ${POSTGRES_DB:-hlopushka}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hlopushka} -d ${POSTGRES_DB:-hlopushka}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hlopushka}:${POSTGRES_PASSWORD:-hlopushka}@postgres:5432/${POSTGRES_DB:-hlopushka}?schema=public
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:4000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
